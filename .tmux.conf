# ---------- Core ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g escape-time 10
set -g repeat-time 500
set -g history-limit 100000
set -g allow-passthrough on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
setw -g automatic-rename on
set -g monitor-bell off
set -g visual-bell off

# Reload and preserve the current pane's directory when creating panes/windows.
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
unbind %
bind '\' split-window -h -c '#{pane_current_path}'
unbind '"'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Vim-style pane navigation and convenient resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r Left resize-pane -L 3
bind -r Down resize-pane -D 3
bind -r Up resize-pane -U 3
bind -r Right resize-pane -R 3
bind m resize-pane -Z

# Clipboard support: native macOS, Wayland/X11 Linux, and WSL.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
if-shell 'command -v clip.exe >/dev/null 2>&1' 'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"'
if-shell 'command -v xclip >/dev/null 2>&1' 'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"'
if-shell 'command -v xsel >/dev/null 2>&1' 'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel --clipboard --input"'
if-shell 'command -v wl-copy >/dev/null 2>&1' 'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"'
if-shell 'command -v pbcopy >/dev/null 2>&1' 'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'

# ---------- Catppuccin Mocha ----------
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "bg=default,fg=#cdd6f4"
set -g message-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g message-command-style "bg=#cba6f7,fg=#1e1e2e,bold"
set -g mode-style "bg=#f9e2af,fg=#1e1e2e,bold"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] 󰆍 #S #[fg=#cba6f7,bg=default] "

# Pick an icon for the active process in each window (requires a Nerd Font).
set -g @window-icon '#{?#{m/r:^(n?vim|vi|view)$,#{pane_current_command}},,#{?#{m/r:^(lazygit|git)$,#{pane_current_command}},,#{?#{m/r:^(yazi|ranger|lf)$,#{pane_current_command}},󰇥,#{?#{m/r:^(ssh|mosh)$,#{pane_current_command}},󰣀,#{?#{m/r:^(node|npm|pnpm|yarn|bun)$,#{pane_current_command}},,#{?#{m/r:^(python|python3|ipython)$,#{pane_current_command}},,#{?#{m/r:^(docker|lazydocker)$,#{pane_current_command}},,#{?#{m/r:^(btop|htop|top)$,#{pane_current_command}},󰍛,#{?#{m/r:^(go|cargo|rustc)$,#{pane_current_command}},,#{?#{m/r:^(zsh|bash|fish|sh|nu|pwsh)$,#{pane_current_command}},,󰆍}}}}}}}}}}'

setw -g window-status-separator " "
setw -g window-status-format "#[fg=#7f849c,bg=#313244]#[fg=#bac2de,bg=#313244] #I #{E:@window-icon} #W #[fg=#313244,bg=default]"
setw -g window-status-current-format "#[fg=#89b4fa,bg=default]#[fg=#1e1e2e,bg=#89b4fa,bold] #I #{E:@window-icon} #W #[fg=#89b4fa,bg=default]"
setw -g window-status-activity-style "fg=#f9e2af,bold"

set -g status-right "#{?client_prefix,#[fg=#1e1e2e\,bg=#f9e2af\,bold] PREFIX #[fg=#f9e2af\,bg=default] ,}#[fg=#fab387,bg=default]#[fg=#1e1e2e,bg=#fab387,bold]  #{b:pane_current_path} #[fg=#fab387,bg=default] #[fg=#a6e3a1,bg=default]#[fg=#1e1e2e,bg=#a6e3a1,bold] 󰥔 %H:%M #[fg=#a6e3a1,bg=default]"

# ---------- Plugins ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

if-shell -b '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run-shell ~/.tmux/plugins/tpm/tpm'
