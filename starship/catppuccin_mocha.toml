"$schema" = "https://starship.rs/config-schema.json"

# A compact two-line Catppuccin prompt. Slow modules are intentionally omitted.
add_newline = true
command_timeout = 800
scan_timeout = 20
palette = "catppuccin_mocha"

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$fill\
$cmd_duration\
$jobs\
$status\
$time\
$line_break\
$character"""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
overlay1 = "#7f849c"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "fg:base bg:mauve"
format = "[](fg:mauve)[$symbol ]($style)"

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"
Windows = "󰍲"

[username]
show_always = false
style_user = "fg:base bg:mauve bold"
style_root = "fg:base bg:red bold"
format = "[$user ]($style)"

[hostname]
ssh_only = true
style = "fg:base bg:mauve bold"
format = "[@$hostname ]($style)"
trim_at = "."

[directory]
style = "fg:base bg:peach bold"
format = "[](fg:mauve bg:peach)[ $path ]($style)[](fg:peach)"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:red bg:peach"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
"GitHub" = "󰊤 "

[git_branch]
symbol = " "
style = "fg:green bold"
format = "[ $symbol$branch]($style)"
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "fg:yellow"
format = "([ $all_status$ahead_behind]($style))"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*$count"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[fill]
symbol = " "

[cmd_duration]
min_time = 1500
show_milliseconds = false
style = "fg:yellow"
format = "[󱎫 $duration ]($style)"

[jobs]
symbol = "󰜎"
style = "fg:blue"
format = "[$symbol $number ]($style)"

[status]
disabled = false
symbol = ""
style = "fg:red"
format = "[$symbol $status ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:overlay1"
format = "[ $time](fg:overlay1)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"
vimcmd_replace_one_symbol = "[❮](bold peach)"
vimcmd_replace_symbol = "[❮](bold red)"
vimcmd_visual_symbol = "[❮](bold yellow)"

# Language modules appear only inside matching projects.
[nodejs]
symbol = " "
style = "fg:green"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "fg:yellow"
format = 'via [$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'

[rust]
symbol = " "
style = "fg:peach"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "fg:sky"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "fg:blue"
format = "via [$symbol$context]($style) "
only_with_files = true
